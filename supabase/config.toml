# Local development stack. `supabase start` reads this to run Postgres, the
# API, Auth, Storage and Studio on your machine. None of it touches a hosted
# project — `supabase link` does that, separately.
project_id = "duo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches every email the app sends locally — confirmations, reset links —
# and shows them at http://localhost:54324 instead of posting them anywhere.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Photos, stories and chat images all live here. Private: the app hands out
# short-lived signed URLs rather than making the bucket public.
[storage.buckets.moments]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/avif"]

[auth]
enabled = true
# Where links in emails point, and the only origins a redirect may land on.
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://localhost:8080/auth/callback",
  "http://localhost:8080/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Off locally so a signup logs you straight in. Leave it ON in production —
# without it anyone can register an address they do not control.
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Flip enabled to true and set those two in .env to test Google sign-in
# locally. Email and password work without it.
skip_nonce_check = false

[analytics]
enabled = false
